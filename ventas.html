<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria Cuatro Patas - Registrar Venta</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🐾 Veterinaria Cuatro Patas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="mascotas.html">Mascotas</a></li>
                    <li class="nav-item"><a class="nav-link" href="inventario.html">Inventario</a></li>
                    <li class="nav-item"><a class="nav-link active" href="ventas.html">Ventas</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <h2 class="mb-4 text-warning text-dark">🛒 Registrar Nueva Venta</h2>

        <div class="row g-4">
            <!-- Formulario de Venta -->
            <div class="col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-warning text-dark fw-bold">
                        Nueva Operación
                    </div>
                    <div class="card-body">
                        <form id="form-venta">
                            <!-- Selección de Cliente -->
                            <div class="mb-3">
                                <label for="select-cliente" class="form-label">Cliente *</label>
                                <select class="form-select" id="select-cliente" required>
                                    <option value="">Cargando clientes...</option>
                                </select>
                            </div>

                            <!-- Selección de Producto -->
                            <div class="mb-3">
                                <label for="select-producto" class="form-label">Producto *</label>
                                <select class="form-select" id="select-producto" required>
                                    <option value="">Cargando productos...</option>
                                </select>
                            </div>

                            <!-- Cantidad -->
                            <div class="mb-3">
                                <label for="input-cantidad" class="form-label">Cantidad *</label>
                                <input type="number" class="form-control" id="input-cantidad" value="1" min="1" required>
                            </div>

                            <!-- Forma de Pago -->
                            <div class="mb-3">
                                <label for="select-pago" class="form-label">Medio de Pago</label>
                                <select class="form-select" id="select-pago">
                                    <option value="Efectivo">Efectivo</option>
                                    <option value="Mercado Pago / Transferencia">Mercado Pago / Transferencia</option>
                                    <option value="Tarjeta de Débito">Tarjeta de Débito</option>
                                    <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                                </select>
                            </div>

                            <!-- Resumen del Total -->
                            <div class="alert alert-secondary text-center mb-3">
                                <span class="fs-6 text-muted">Total a pagar:</span><br>
                                <strong class="fs-3 text-success" id="total-estimado">$0,00</strong>
                            </div>

                            <button type="submit" class="btn btn-warning w-100 fw-bold">Confirmar Venta</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Historial de Ventas -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold">
                        Historial de Ventas Registradas
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0 align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Cliente</th>
                                        <th>Fecha</th>
                                        <th>Medio de Pago</th>
                                        <th>Total</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-ventas">
                                    <tr>
                                        <td colspan="5" class="text-center text-muted py-3">Cargando ventas...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/ventas.js"></script>
</body>
</html>
