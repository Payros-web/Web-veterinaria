<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria Cuatro Patas - Inventario</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🐾 Veterinaria Cuatro Patas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="mascotas.html">Mascotas</a></li>
                    <li class="nav-item"><a class="nav-link" href="turnos.html">Turnos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="inventario.html">Inventario</a></li>
                    <li class="nav-item"><a class="nav-link" href="ventas.html">Ventas</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <h2 class="mb-4 text-success">📦 Control de Inventario y Productos</h2>

        <div class="row g-4">
            <!-- Formulario de Registro de Producto -->
            <div class="col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white fw-bold">
                        Agregar Nuevo Producto
                    </div>
                    <div class="card-body">
                        <form id="form-producto">
                            <div class="mb-3">
                                <label for="prod-nombre" class="form-label">Nombre del Producto *</label>
                                <input type="text" class="form-control" id="prod-nombre" required placeholder="Ej: Pipeta Antipulgas">
                            </div>
                            <div class="mb-3">
                                <label for="prod-precio" class="form-label">Precio ($) *</label>
                                <input type="number" step="0.01" class="form-control" id="prod-precio" required placeholder="Ej: 6200.00">
                            </div>
                            <div class="mb-3">
                                <label for="prod-stock" class="form-label">Stock Inicial *</label>
                                <input type="number" class="form-control" id="prod-stock" required placeholder="Ej: 15" min="0">
                            </div>
                            <button type="submit" class="btn btn-success w-100">Guardar Producto</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Inventario -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold">
                        Stock Actual
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0 align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Producto</th>
                                        <th>Precio</th>
                                        <th>Stock</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-productos">
                                    <tr>
                                        <td colspan="4" class="text-center text-muted py-3">Cargando inventario...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/inventario.js"></script>
</body>
</html>
