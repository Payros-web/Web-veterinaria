<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos - Veterinaria Cuatro Patas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🐾 Cuatro Patas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="mascotas.html">Mascotas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="turnos.html">Turnos</a></li>
                    <li class="nav-item"><a class="nav-link" href="inventario.html">Inventario</a></li>
                    <li class="nav-item"><a class="nav-link" href="ventas.html">Ventas</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <h2 class="mb-4 text-center fw-bold">📅 Agenda y Gestión de Turnos</h2>

        <div class="row g-4">
            <!-- FORMULARIO NUEVO TURNO -->
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white fw-semibold">
                        Agendar Nuevo Turno
                    </div>
                    <div class="card-body">
                        <form id="formTurno">
                            <div class="mb-3">
                                <label class="form-label">Dueño / Cliente</label>
                                <select id="clienteSelect" class="form-select" required>
                                    <option value="">Cargando clientes...</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mascota</label>
                                <select id="mascotaSelect" class="form-select" required disabled>
                                    <option value="">Seleccione un dueño primero...</option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fecha</label>
                                    <input type="date" id="fechaTurno" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Hora</label>
                                    <input type="time" id="horaTurno" class="form-control" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Motivo de Consulta</label>
                                <select id="motivoTurno" class="form-select" required>
                                    <option value="Consulta General">Consulta General</option>
                                    <option value="Vacunación / Desparasitación">Vacunación / Desparasitación</option>
                                    <option value="Peluquería / Baño">Peluquería / Baño</option>
                                    <option value="Control / Retorno">Control / Retorno</option>
                                    <option value="Cirugía / Especialidad">Cirugía / Especialidad</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Guardar Turno</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- TABLA DE TURNOS -->
            <div class="col-md-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white fw-semibold">
                        Próximos Turnos Agendados
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Fecha / Hora</th>
                                        <th>Mascota (Dueño)</th>
                                        <th>Motivo</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaTurnos">
                                    <tr>
                                        <td colspan="5" class="text-center py-3 text-muted">Cargando turnos...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="Js/turnos.js"></script>
</body>
</html>
